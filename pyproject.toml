[project]
name = "image-downloader"
version = "1.0.0"
description = "Download images listed in a plaintext file, safely and concurrently."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adithi M Shrouthy", email = "adithimshrouthy@gmail.com" }]
keywords = ["images", "download", "cli", "http"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
image-downloader = "image_downloader.cli:main"

[project.urls]
Repository = "https://github.com/adithimanjunath/url-image-downloader"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_downloader"]

# --- Quality gates -----------------------------------------------------------
# Ruff replaces black + isort + flake8 with one fast tool. Its formatter is
# black-compatible, so the house style the JD asks for is preserved.
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # prefer pathlib
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101", # assert is fine: used as an invariant guard, and pytest needs it
]

[tool.ruff.lint.per-file-ignores]
# Tests bind to localhost and use hardcoded fixture data by design.
"tests/**" = ["S104", "S105", "S106", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["e2e: end-to-end tests that invoke the installed console script"]

[tool.coverage.run]
source = ["image_downloader"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
